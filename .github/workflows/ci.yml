name: Checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prepare:tools
      - run: npm run check:public
      - run: npm test
        timeout-minutes: 3
      - run: npm run build
      - name: Build Windows portable package
        if: runner.os == 'Windows'
        run: npm run package:win
      - name: Verify Windows app without developer tools on PATH
        if: runner.os == 'Windows'
        timeout-minutes: 4
        env:
          DEBUG: pw:browser*
        run: npm run qa:portable
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-verification
          path: output/qa/portable/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && success()
        with:
          name: windows-package
          path: output/desktop/AIUI-Workbench-*.zip
          if-no-files-found: error
