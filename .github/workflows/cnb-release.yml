name: Sync latest release to CNB
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnb-latest-release
  cancel-in-progress: false
jobs:
  sync:
    if: vars.CNB_REPOSITORY != '' && (github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sync signed release files and update feed
        env:
          CNB_REPOSITORY: ${{ vars.CNB_REPOSITORY }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-cnb-release.mjs
