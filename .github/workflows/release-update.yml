name: Real GitHub upgrade
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_version:
        description: Published target version
        required: false
      from_version:
        description: Previous published version (blank selects the latest stable version below the target)
        required: false
permissions:
  contents: read
concurrency:
  group: real-github-upgrade
  cancel-in-progress: true
jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run a real previous-client upgrade from GitHub
        env:
          AIUI_UPDATE_TARGET_VERSION: ${{ inputs.target_version || '' }}
          AIUI_UPDATE_FROM_VERSION: ${{ inputs.from_version || '' }}
          AIUI_QA_GITHUB_TOKEN: ${{ github.token }}
        run: npm run qa:github-upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-upgrade-${{ runner.os }}
          path: output/qa/github-upgrade/
